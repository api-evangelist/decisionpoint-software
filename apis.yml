name: DecisionPoint Software
description: 'DecisionPoint Software was a San Mateo, California-based enterprise software
  company that provided packaged financial performance management (FPM) and financial
  data warehousing software, built primarily around the Oracle ERP stack. Its systems
  captured and moved continuously changing data from financial source systems into
  a data warehouse, automatically configuring the analytic environment as the source
  systems changed, and shipped as far as Release 11 with operations in both the United
  States and the United Kingdom. The company was named one of the 50 fastest-growing
  private companies in Silicon Valley in 2004 and raised a $5M Series B round from
  Battery Ventures that same year. It was acquired in December 2005 by NCR''s Teradata
  data warehousing division, which folded the FPM and data warehousing technology into
  the Teradata enterprise data warehouse offering. DecisionPoint Software has not
  operated as an independent company for roughly two decades: it publishes no website,
  developer portal, documentation, or public API surface, and this profile is retained
  as a historical portfolio-lead record rather than an active API provider.'
